# 数据集参数
dataset:
  model_type: "medium"
  batch_size: 8
  steps: 20000
  context_length: 128
  vocab_size: 10000
  
model:
  d_model: 1024
  d_ff: 4096
  num_layers: 24
  num_heads: 16
  rope_theta: 10000.0

train:
  max_l2_norm: 1.0
  valid_interval: 500
  ckpt_interval: 20000
  lr: 0.0003
  betas: (0.9,0.999)
  weight_decay: 0.01
  min_lr: 0.0001
  warm_up_iter_rate: 0.1
  max_iter_rate: 1.0